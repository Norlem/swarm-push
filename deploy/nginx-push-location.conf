# Add this location block to /etc/nginx/sites-enabled/fleet-manager
# BEFORE the catch-all "location / {" block.
#
# Routes CloudFront /push/* requests to the swarm-push service on localhost:5200.
# CloudFront /push/* behavior must target the fleet-manager-ec2 origin (port 80)
# so that the X-Fleet-Origin-Secret header is injected and nginx admits the request.
#
# The SG quota on sg-08276f8c77a86925a is exhausted by the CloudFront prefix list
# (45 entries each), so a direct port-5200 SG rule is not possible without a quota
# increase. This nginx proxy is the correct long-term approach anyway.

    location /push/ {
        proxy_pass http://127.0.0.1:5200/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30;
    }
